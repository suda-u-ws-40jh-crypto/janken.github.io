<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>じゃんけん</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
    <header>
        <h1>じゃんけんゲーム</h1>
        <h2>コンピューターとじゃんけんをしよう</h2>
    </header>
    <div class="playerHand">
        <button style="height:50px;" id="paper" type="button" value="paper"><img src="./images/paper.png" alt="paperImage" style="height: 100%;"/>パー</button>
        <button style="height:50px;" id="scissors" type="button" value="scissors"><img src="./images/scissors.png" alt="scissorsImage" style="height:100%;"/>チョキ
        </button>
        <button style="height:50px;" id="rock" type="button" value="rock"><img src="./images/rock.png" alt="rock" style="height:100%;"/>グー
        </button>
    </div>
    <p>あなたの手は<img src="./images/waiting/"/></p>
    <p>コンピューターの手は<img src="./images/waiting.png"/></p>
    <p>あなたの<span id="winLoseArea"></span></p>
    <script type="module" src="./script.js"></script>
    </body>
</html>
