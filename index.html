<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>じゃんけん</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
    <header>
        <div class= "heading">
            <h1>じゃんけんゲーム</h1>
            <h2>コンピューターとじゃんけんをしよう</h2>
        </div>
    </header>
    <div class="playerHand">
        <button style="height:50px;" id="paper" type="button" value="paper">
            <img src="./images/paper.png" alt="paperImage" style="height: 100%;"/>パー
        </button>
        <button style="height:50px;" id="scissors" type="button" value="scissors">
            <img src="./images/scissors.png" alt="scissorsImage" style="height:100%;"/>チョキ
        </button>
        <button style="height:50px;" id="rock" type="button" value="rock">
            <img src="./images/rock.png" alt="rock" style="height:100%;"/>グー
        </button>
    </div>
    <div class = "result">
        <div class = "handresult">
            <p>あなたの手は
                <span id = "playerhand">
                    <img src="./images/waiting.png" style="height:50px;" />
                </span>
            </p>
            <p>コンピューターの手は
                <span id = "computerhand">
                    <img src="./images/waiting.png" style="height:50px;"/>
                </span>
            </p>
        </div>
        <p class = "winLoseArea">
            じゃんけんの結果は
        </p>
        <p class = "winLoseArea" id = "resultArea"><span class= "winLoseArea"></span></p>
    </div>
    <script type="module" src="./script.js"></script>
    </body>
</html>
